[package]
name = "genesismesh-radio-wisblock"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Experimental no_std WisBlock storage and clock adapters"

[dependencies]
embedded-hal = "=1.0.0"
genesismesh-radio-device = { path = "../genesismesh-radio-device" }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
