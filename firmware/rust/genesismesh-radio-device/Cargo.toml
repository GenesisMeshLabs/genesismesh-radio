[package]
name = "genesismesh-radio-device"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Portable no_std radio protocol and conservative device command recovery"

[dependencies]
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde_json = "1.0"
hex = "0.4.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
